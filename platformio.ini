# ══════════════════════════════════════════════════════════════════════════════
# platformio.ini — NCKH Health Monitor
# Ba nhánh: Stress PPG | ECG AF/non-AF (Edge Impulse) | SpO₂ (Maxim/SparkFun)
#
# Môi trường:
#   esp32-s3-devkitc-1 (mặc định):
#     Build không có TEST_OFFLINE_FIXTURE. Boot → NOT_READY → idle loop.
#     Dành cho khi có phần cứng thực hoặc kiểm tra firmware sạch.
#
#   test_fixture:
#     Build với -DTEST_OFFLINE_FIXTURE=1.
#     Chạy fixture cố định để kiểm tra API tích hợp ba nhánh.
#     Output Serial ghi rõ: "OFFLINE TEST — NOT A SENSOR MEASUREMENT".
#     KHÔNG dùng để báo cáo kết quả đo người thật.
# ══════════════════════════════════════════════════════════════════════════════

# ── Cấu hình dùng chung ──────────────────────────────────────────────────────
[env_common]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
build_flags =
    -DBOARD_ESP32_S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    ; Edge Impulse: ARDUINO macro từ Arduino framework tự detect EI_PORTING_ARDUINO=1.
    ; Không redefine thủ công.
    -DEIDSP_USE_CMSIS_DSP=0
    -DARM_MATH_CM4=0
    ; ECG_arrhythmia_EI: root phải trên include path để
    ;   #include "edge-impulse-sdk/..."  và  #include "model-parameters/..."
    ;   và  #include "tflite-model/..."  đều resolve đúng.
    -I lib/ECG_arrhythmia_EI
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2
; EI Arduino porting phải được compile tường minh (guarded by ARDUINO macro).
build_src_filter =
    +<*>
    +<../lib/ECG_arrhythmia_EI/edge-impulse-sdk/porting/arduino/ei_classifier_porting.cpp>
    +<../lib/ECG_arrhythmia_EI/edge-impulse-sdk/porting/arduino/debug_log.cpp>
; ── Bản sao gốc / backup — bị bỏ qua tường minh ──────────────────────────
; Bản ĐANG DÙNG (có library.json, được build):
;   lib/ECG_arrhythmia_EI        ← copy sạch từ ecg_arrhythmia-cpp-mcu-v1-impulse-#1
;   lib/ResearchSpO2             ← copy từ SPO2_Module_MAX30102_v0_1/SPO2_Module/lib/
;   lib/Stress_PPG_60s_model     ← copy từ Stress_PPG_60s_model_portable/Stress_PPG_60s_model/
; Bản KHÔNG BUILD (bị ignore tường minh, giữ lại vì chứa CSV/docs/test Python):
;   lib/ecg_arrhythmia-cpp-mcu-v1-impulse-#1  ← ký tự # gây lỗi PATH Windows
;   lib/SPO2_Module_MAX30102_v0_1              ← chứa HUONG_DAN.txt, tests/data/
;   lib/Stress_PPG_60s_model_portable          ← chứa stress_hrv_features_60s_test.csv, predict.py
;   lib/step2_handoff_sqi_v0_1-20260924T133622Z-1-001 ← gói Step 2 của nhóm trưởng (CSV/Python)
lib_ignore =
    ecg_arrhythmia-cpp-mcu-v1-impulse-#1
    SPO2_Module_MAX30102_v0_1
    Stress_PPG_60s_model_portable
    step2_handoff_sqi_v0_1-20260924T133622Z-1-001

# ── Môi trường mặc định: không có fixture, không tạo dữ liệu giả ─────────────
[env:esp32-s3-devkitc-1]
platform = ${env_common.platform}
board = ${env_common.board}
framework = ${env_common.framework}
monitor_speed = ${env_common.monitor_speed}
lib_ldf_mode = ${env_common.lib_ldf_mode}
build_flags = ${env_common.build_flags}
board_build.arduino.memory_type = ${env_common.board_build.arduino.memory_type}
board_upload.flash_size = ${env_common.board_upload.flash_size}
lib_deps = ${env_common.lib_deps}
build_src_filter = ${env_common.build_src_filter}
lib_ignore = ${env_common.lib_ignore}

# ── Môi trường fixture: API test với dữ liệu hardcoded ───────────────────────
# Dùng: pio run -e test_fixture
# Output Serial phải ghi rõ "OFFLINE TEST — NOT A SENSOR MEASUREMENT".
[env:test_fixture]
platform = ${env_common.platform}
board = ${env_common.board}
framework = ${env_common.framework}
monitor_speed = ${env_common.monitor_speed}
lib_ldf_mode = ${env_common.lib_ldf_mode}
build_flags =
    ${env_common.build_flags}
    -DTEST_OFFLINE_FIXTURE=1
board_build.arduino.memory_type = ${env_common.board_build.arduino.memory_type}
board_upload.flash_size = ${env_common.board_upload.flash_size}
lib_deps = ${env_common.lib_deps}
build_src_filter = ${env_common.build_src_filter}
lib_ignore = ${env_common.lib_ignore}
