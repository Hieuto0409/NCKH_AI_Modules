[platformio]
default_envs = esp32-s3-devkitc-1

[esp32-s3-base]
platform = espressif32
board = esp32-s3-devkitc-1-n16r8
framework = arduino
upload_port = COM6
monitor_port = COM6
monitor_speed = 921600
lib_ldf_mode = deep+
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_LOOP_STACK_SIZE=32768
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DI2C_BUFFER_LENGTH=32
    -DEIDSP_USE_CMSIS_DSP=0
    -DARM_MATH_CM4=0
    -I lib/ECG_arrhythmia_EI
build_src_filter =
    +<*>
    +<../lib/ECG_arrhythmia_EI/edge-impulse-sdk/porting/arduino/ei_classifier_porting.cpp>
    +<../lib/ECG_arrhythmia_EI/edge-impulse-sdk/porting/arduino/debug_log.cpp>
lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ 1.1.2
    olikraus/U8g2 @ ^2.36.5
    knolleary/PubSubClient @ ^2.8

[env:esp32-s3-devkitc-1]
extends = esp32-s3-base
build_flags =
    ${esp32-s3-base.build_flags}
    -DAPP_ENABLE_OLED=1
    -DAPP_ENABLE_AI=1
    -DAPP_ENABLE_MQTT=0
    -DAPP_ENABLE_BINARY_LOG=0
    -DAPP_ENABLE_CSV_LOG=0

[env:esp32-s3-devkitc-1-mqtt]
extends = esp32-s3-base
build_flags =
    ${esp32-s3-base.build_flags}
    -DAPP_ENABLE_OLED=1
    -DAPP_ENABLE_AI=1
    -DAPP_ENABLE_MQTT=1
    -DAPP_ENABLE_BINARY_LOG=0
    -DAPP_ENABLE_CSV_LOG=0

[env:esp32-s3-devkitc-1-raw-log]
extends = esp32-s3-base
build_flags =
    ${esp32-s3-base.build_flags}
    -DAPP_ENABLE_OLED=0
    -DAPP_ENABLE_AI=0
    -DAPP_ENABLE_MQTT=0
    -DAPP_ENABLE_BINARY_LOG=1
    -DAPP_ENABLE_CSV_LOG=0

[env:esp32-s3-devkitc-1-fixture]
extends = esp32-s3-base
build_flags =
    ${esp32-s3-base.build_flags}
    -DAPP_ENABLE_OLED=0
    -DAPP_ENABLE_AI=1
    -DAPP_ENABLE_MQTT=0
    -DAPP_ENABLE_BINARY_LOG=0
    -DAPP_ENABLE_CSV_LOG=0
    -DPPGFW_OFFLINE_FIXTURE=1

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -std=gnu++17
    -DPPGFW_NATIVE_TEST=1
lib_ignore =
    ECG_arrhythmia_EI
build_src_filter =
    -<*>
    +<native_test_hooks.cpp>
    +<metrics/heart_rate.cpp>
    +<metrics/hrv.cpp>
    +<metrics/prv.cpp>
    +<metrics/spo2.cpp>
    +<metrics/spo2_calibration.cpp>
    +<metrics/spo2_rate_adapter.cpp>
    +<dsp/ac_dc_estimator.cpp>
    +<dsp/filters.cpp>
    +<dsp/peak_detector_ppg.cpp>
    +<dsp/rpeak_detector.cpp>
    +<acquisition/sample_integrity.cpp>
    +<acquisition/timestamp_service.cpp>
    +<quality/ppg_sqi.cpp>
    +<quality/ecg_sqi.cpp>
    +<quality/quality_gate.cpp>
    +<ai/noop_engine.cpp>
    +<ai/ecg_af_model_adapter.cpp>
    +<ai/stress_engine.cpp>
    +<ai/low_o2_engine.cpp>
    +<ai/rhythm_engine.cpp>
    +<ai/decision_aggregator.cpp>
    +<features/stress_ppg_60s_adapter.cpp>
    +<features/ecg_af_feature_adapter.cpp>

    +<drivers/max30102_fifo.cpp>
    +<drivers/ecg_adc_backend.cpp>
    +<acquisition/ecg_acquisition.cpp>
    +<app/measurement_state_machine.cpp>

    +<features/ecg_window_builder.cpp>
    +<features/feature_builder.cpp>
    +<features/ecg_features.cpp>
    +<features/ppg_features.cpp>
    +<dsp/ppg_preprocess.cpp>
    +<dsp/ecg_preprocess.cpp>
